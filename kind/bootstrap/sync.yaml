{
  "apiVersion": "kustomize.toolkit.fluxcd.io/v1",
  "kind": "Kustomization",
  "metadata": {
    "name": "flux-system",
    "namespace": "flux-system"
  },
  "spec": {
    "interval": "5m",
    "path": "./clusters/kind",
    "prune": true,
    "sourceRef": {
      "kind": "GitRepository",
      "name": "flux-system"
    },
    "wait": false,
    "postBuild": {
      "substituteFrom": [
        {
          "kind": "ConfigMap",
          "name": "kind-runtime"
        }
      ]
    }
  }
}

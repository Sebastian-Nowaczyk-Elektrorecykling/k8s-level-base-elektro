{
  "apiVersion": "helm.toolkit.fluxcd.io/v2",
  "kind": "HelmRelease",
  "metadata": {
    "name": "kind-gateway",
    "namespace": "gateway-system"
  },
  "spec": {
    "interval": "10m",
    "timeout": "10m",
    "releaseName": "kind-gateway",
    "chart": {
      "spec": {
        "chart": "traefik",
        "version": "41.6.0",
        "sourceRef": {
          "kind": "HelmRepository",
          "name": "kind-traefik"
        }
      }
    },
    "install": {
      "crds": "Skip",
      "remediation": {
        "retries": 2
      }
    },
    "upgrade": {
      "crds": "Skip",
      "remediation": {
        "retries": 2
      }
    },
    "driftDetection": {
      "mode": "enabled"
    },
    "values": {
      "fullnameOverride": "kind-gateway",
      "deployment": {
        "replicas": 1
      },
      "updateStrategy": {
        "type": "RollingUpdate",
        "rollingUpdate": {
          "maxSurge": 0,
          "maxUnavailable": 1
        }
      },
      "nodeSelector": {
        "elektro.internal/edge": "true"
      },
      "providers": {
        "kubernetesCRD": {
          "enabled": false
        },
        "kubernetesIngress": {
          "enabled": false
        },
        "kubernetesGateway": {
          "enabled": true,
          "statusAddress": {
            "ip": "${API_IP}",
            "service": {
              "enabled": false
            }
          }
        }
      },
      "gateway": {
        "enabled": false
      },
      "gatewayClass": {
        "enabled": false
      },
      "ingressClass": {
        "enabled": false
      },
      "api": {
        "dashboard": false
      },
      "service": {
        "spec": {
          "type": "ClusterIP"
        }
      },
      "ports": {
        "web": {
          "port": 80,
          "hostPort": 80,
          "exposedPort": 80
        },
        "websecure": {
          "port": 443,
          "hostPort": 443,
          "exposedPort": 443
        }
      },
      "securityContext": {
        "capabilities": {
          "drop": [
            "ALL"
          ],
          "add": [
            "NET_BIND_SERVICE"
          ]
        }
      },
      "resources": {
        "requests": {
          "cpu": "100m",
          "memory": "128Mi"
        },
        "limits": {
          "memory": "512Mi"
        }
      }
    }
  }
}

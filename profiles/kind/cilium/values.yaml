{
  "cluster": {
    "name": "elektro-test",
    "id": 1
  },
  "kubeProxyReplacement": true,
  "k8sServiceHost": "${API_IP}",
  "k8sServicePort": 6443,
  "ipam": {
    "mode": "kubernetes"
  },
  "routingMode": "tunnel",
  "tunnelProtocol": "vxlan",
  "bpf": {
    "masquerade": true
  },
  "l2announcements": {
    "enabled": false
  },
  "ingressController": {
    "enabled": false,
    "default": false
  },
  "l7Proxy": true,
  "gatewayAPI": {
    "enabled": true,
    "gatewayClass": {
      "create": "false"
    },
    "hostNetwork": {
      "enabled": true,
      "nodes": {
        "matchLabels": {
          "elektro.internal/edge": "true"
        }
      }
    }
  },
  "envoy": {
    "enabled": true,
    "prometheus": {
      "enabled": true
    },
    "securityContext": {
      "capabilities": {
        "keepCapNetBindService": true,
        "envoy": [
          "NET_ADMIN",
          "SYS_ADMIN",
          "NET_BIND_SERVICE"
        ]
      }
    }
  },
  "operator": {
    "replicas": 1,
    "tolerations": [
      {
        "operator": "Exists"
      }
    ],
    "prometheus": {
      "enabled": true
    },
    "dashboards": {
      "enabled": true
    }
  },
  "dashboards": {
    "enabled": true
  },
  "prometheus": {
    "enabled": true
  },
  "certgen": {
    "tolerations": [
      {
        "operator": "Exists"
      }
    ]
  },
  "hubble": {
    "enabled": true,
    "tls": {
      "enabled": true,
      "auto": {
        "enabled": true,
        "method": "cronJob"
      }
    },
    "relay": {
      "enabled": true,
      "tolerations": [
        {
          "operator": "Exists"
        }
      ],
      "prometheus": {
        "enabled": true
      }
    },
    "ui": {
      "enabled": true,
      "tolerations": [
        {
          "operator": "Exists"
        }
      ],
      "ingress": {
        "enabled": false
      }
    },
    "metrics": {
      "enabled": [
        "dns",
        "drop",
        "tcp",
        "flow",
        "icmp",
        "httpV2:exemplars=true;labelsContext=source_namespace,destination_namespace"
      ],
      "enableOpenMetrics": true,
      "dashboards": {
        "enabled": true
      }
    }
  },
  "cgroup": {
    "autoMount": {
      "enabled": false
    },
    "hostRoot": "/sys/fs/cgroup"
  },
  "image": {
    "pullPolicy": "IfNotPresent"
  },
  "devices": [
    "eth0"
  ]
}

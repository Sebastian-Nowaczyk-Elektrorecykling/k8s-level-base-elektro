{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "kind-host-iscsi",
    "namespace": "longhorn-system"
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "longhorn.io/component": "instance-manager"
      }
    },
    "policyTypes": [
      "Ingress"
    ],
    "ingress": [
      {
        "from": [
          {
            "ipBlock": {
              "cidr": "169.254.0.0/16"
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 3260
          }
        ]
      }
    ]
  }
}

{
  "apiVersion": "kustomize.config.k8s.io/v1beta1",
  "kind": "Kustomization",
  "resources": [
    "../../../storage/infrastructure/longhorn",
    "host-iscsi.yaml"
  ],
  "patches": [
    {
      "target": {
        "kind": "HelmRelease",
        "name": "longhorn"
      },
      "patch": "{\"apiVersion\": \"helm.toolkit.fluxcd.io/v2\", \"kind\": \"HelmRelease\", \"metadata\": {\"name\": \"longhorn\", \"namespace\": \"longhorn-system\"}, \"spec\": {\"values\": {\"longhornUI\": {\"replicas\": 1}, \"csi\": {\"attacherReplicaCount\": 1, \"provisionerReplicaCount\": 1, \"resizerReplicaCount\": 1, \"snapshotterReplicaCount\": 1}}}}"
    }
  ]
}

# cilium and cert-manager are read-only dependencies owned by the base repository.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-namespaces
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: storage-addons
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 25m
  path: ./storage/infrastructure/namespaces
  sourceRef:
    kind: GitRepository
    name: storage-addons
  prune: false
  deletionPolicy: Orphan
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-sources
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: storage-addons
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 25m
  path: ./storage/infrastructure/sources
  sourceRef:
    kind: GitRepository
    name: storage-addons
  prune: true
  deletionPolicy: Orphan
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1

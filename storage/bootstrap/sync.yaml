apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-addons
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: storage-addons
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  path: ./storage/clusters/lan
  sourceRef:
    kind: GitRepository
    name: storage-addons
  prune: true
  deletionPolicy: Orphan
  # Children wait for their own Helm releases; this parent manages itself too.
  wait: false

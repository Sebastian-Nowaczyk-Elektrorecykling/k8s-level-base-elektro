name: Validate storage and profiles
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: azure/setup-helm@v4
        with: {version: v3.19.0}
      - name: Install validation tools
        run: |
          pip install -r tests/requirements.txt
          mkdir -p .cache/bin
          cd .cache/bin
          curl -fsSL --retry 3 https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.1/kustomize_v5.7.1_linux_amd64.tar.gz -o kustomize.tgz
          echo 'ea375e7372f9aa029129d4b2d16c66b7750b7f1213c4f66f910d981c895818d8  kustomize.tgz' | sha256sum -c -
          tar -xzf kustomize.tgz kustomize
          curl -fsSL --retry 3 https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz -o kubeconform.tgz
          echo 'c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  kubeconform.tgz' | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          curl -fsSL --retry 3 https://github.com/fluxcd/flux2/releases/download/v2.9.5/flux_2.9.5_linux_amd64.tar.gz -o flux.tgz
          echo 'b853df82adfd7736f580692f9f734473d571606307139f8fd20c2a80dd1ff473  flux.tgz' | sha256sum -c -
          tar -xzf flux.tgz flux
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Validate storage charts and schemas
        run: python3 storage/scripts/validate.py
      - name: Validate both profiles and golden parity
        run: python3 scripts/validate-profiles.py
